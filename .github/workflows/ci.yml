name: check

on:
  push:
    branches: [master]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  platforms:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Show Go version
        run: go version
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 -timeout=10m ./...
      - name: Build without CGO
        run: go build ./...
        env:
          CGO_ENABLED: '0'
  quality:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.15.0
          install-only: true
      - name: Check module integrity and tidiness
        run: make modules
      - name: Lint
        run: make lint
      - name: Check documentation
        run: make docs
      - name: Fuzz
        run: make fuzz
      - name: Run examples
        run: make examples
  interop:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Restore pinned interop inputs
        id: interop-inputs
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306  # v5.0.3
        with:
          path: /tmp/xmlsec-interop-inputs
          key: ${{ runner.os }}-interop-inputs-v1-${{ hashFiles('build/interop-inputs.txt') }}
          restore-keys: ${{ runner.os }}-interop-inputs-v1-
      - name: Prepare and verify pinned interop inputs
        run: sh build/prepare-interop.sh /tmp/xmlsec-interop-inputs
      - name: Save verified interop inputs
        if: steps.interop-inputs.outputs.cache-hit != 'true'
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306  # v5.0.3
        with:
          path: /tmp/xmlsec-interop-inputs
          key: ${{ steps.interop-inputs.outputs.cache-primary-key }}
      - name: Run required external checks and Shibboleth/OpenAM/GSA SOAP servers
        run: make interop-docker
